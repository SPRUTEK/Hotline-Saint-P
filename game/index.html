<script>
window.__pre=[];
['keydown','keyup','mousedown','mouseup','mousemove','touchstart','touchmove','touchend','wheel','contextmenu'].forEach(t=>window.addEventListener(t,e=>{for(const h of window.__pre){try{const r=h(e);if(r===true){e.stopImmediatePropagation();if(e.cancelable)e.preventDefault();return}if(r==='own'){e.stopImmediatePropagation();return}}catch(err){console.error(err)}}},{capture:true,passive:false}));

<script>
'use strict';
// ================= CONFIG =================
// Внутреннее разрешение 320x180, клетка сетки = 8px = 0,25 м.
const W=320,H=180,C=8,GW=31,GH=47;
// HD: каждый «игровой» пиксель делится на Q×Q — логика и координаты прежние, детализация вдвое выше.
const Q=3,FULLHD=true; // 03.11: сетка ×3 (960×540)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('u'),u=ui.getContext('2d');
cv.width=W*Q;cv.height=H*Q;ctx.setTransform(Q,0,0,Q,0,0);
let SC=1,DPR=1,OX=0,OY=0;
function resize(){
  const ww=innerWidth,wh=innerHeight;
  let s=Math.min(ww/W,wh/H); if(s>=2)s=Math.floor(s);
  SC=s;DPR=Math.min(devicePixelRatio||1,2);
  const cw=Math.round(W*s),ch=Math.round(H*s);
  OX=Math.floor((ww-cw)/2);OY=Math.floor((wh-ch)/2);
  for(const c of [cv,ui]){c.style.width=cw+'px';c.style.height=ch+'px';c.style.left=OX+'px';c.style.top=OY+'px'}
  ui.width=Math.round(cw*DPR);ui.height=Math.round(ch*DPR);
}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function mk(w,h,q){h=h||w;q=q||(w*h*Q*Q>1e7?2:Q); // огромные фоны (дороги) — ×2, чтобы влезть в память телефона
  const c=document.createElement('canvas');c.width=Math.round(w*q);c.height=Math.round(h*q);c._q=q;c.lw=w;c.lh=h;return c}
// HD: любой холст из mk() — в Q раз плотнее. Контекст сразу масштабирован, а drawImage без размера рисует его в логическом размере,
// поэтому код глав (24×24 спрайты, фоны уровней) работает как раньше, но с полупиксельными деталями.
(()=>{const gc=HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext=function(t,o){const g=gc.call(this,t,o);if(g&&this._q&&!this._qi&&t==='2d'){this._qi=1;g.setTransform(this._q,0,0,this._q,0,0);g.imageSmoothingEnabled=false}return g};
  // ×3: каждый прямоугольник привязан к сетке реальных пикселей — чёткий пиксель без полутонов
  const fr=CanvasRenderingContext2D.prototype.fillRect;
  CanvasRenderingContext2D.prototype.fillRect=function(x,y,w,h){const cq=this.canvas._q||(this.canvas.id==='c'?Q:0);
    if(cq){const x0=Math.round(x*cq)/cq,y0=Math.round(y*cq)/cq,x1=Math.round((x+w)*cq)/cq,y1=Math.round((y+h)*cq)/cq;if(x1===x0||y1===y0)return;return fr.call(this,x0,y0,x1-x0,y1-y0)}
    return fr.call(this,x,y,w,h)};
  const di=CanvasRenderingContext2D.prototype.drawImage;
  CanvasRenderingContext2D.prototype.drawImage=function(im,a,b,c,d,e,f,g2,h2){
    if(im&&im._q){if(arguments.length===3)return di.call(this,im,a,b,im.lw,im.lh);
      if(arguments.length===9){const q=im._q;return di.call(this,im,a*q,b*q,c*q,d*q,e,f,g2,h2)}}
    return di.apply(this,arguments)};
})();
// HD-фактура: полупиксельная фаска на границах цветов + лёгкое зерно (для фонов уровней)
function hdTexture(cv,grain){const w=cv.width,h=cv.height;if(w*h>16e6)return;const g=cv.getContext('2d');
  let id;try{id=g.getImageData(0,0,w,h)}catch(e){return}const d=id.data,o=new Uint8ClampedArray(d);
  const L=i=>o[i]*.3+o[i+1]*.59+o[i+2]*.11;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;if(o[i+3]<200)continue;
    let k=1;const up=i-w*4,dn=i+w*4,lf=i-4,rt=i+4,me=L(i);
    if(o[up+3]>=200&&Math.abs(L(up)-me)>14){k*=me>L(up)?1.13:1.0}
    if(o[dn+3]>=200&&Math.abs(L(dn)-me)>14){k*=me>L(dn)?1:0.86}
    if(o[lf+3]>=200&&Math.abs(L(lf)-me)>14){k*=me>L(lf)?1.08:1}
    if(o[rt+3]>=200&&Math.abs(L(rt)-me)>14){k*=me>L(rt)?1:0.9}
    if(grain){const v=hash(x*3+1,y*7+5);if(v<.18)k*=.94;else if(v>.86)k*=1.05}
    if(k!==1){d[i]=o[i]*k;d[i+1]=o[i+1]*k;d[i+2]=o[i+2]*k}}
  g.putImageData(id,0,0)}
function mkQ(w,h,wr){h=h||w;const c=FULLHD?mk(w,h):mk(w*Q,h*Q);const g=c.getContext('2d',wr?{willReadFrequently:true}:undefined);g.setTransform(c._q||Q,0,0,c._q||Q,0,0);g.imageSmoothingEnabled=false;return c}
function P(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function ell(g,cx,cy,rx,ry,c,cond){g.fillStyle=c;const k=g.getTransform().a>1.5?Q:1,st=1/k;
  for(let y=Math.floor((cy-ry)*k)/k;y<=cy+ry;y+=st){let run=-1;
    for(let x=Math.floor((cx-rx)*k)/k;x<=cx+rx+st;x+=st){const dx=(x+st/2-cx)/rx,dy=(y+st/2-cy)/ry;const ok=dx*dx+dy*dy<=1&&(!cond||cond(x,y));
      if(ok){if(run<0)run=x}else if(run>=0){g.fillRect(run,y,x-run,st);run=-1}}
    if(run>=0)g.fillRect(run,y,cx+rx+st-run,st)}}

// ================= STATE =================
const S={
  step:0, glass:false, full:false, cotton:false, key:false, bat:false, pistol:false,
  windowOpen:false, litterClean:false, bowls:false, skladLocked:true, alarm:false,
  opened:{}, shake:0, fade:0
};

// ================= MAP (по плану 7,1 × 11,5 м) =================
const grid=[];for(let y=0;y<GH;y++){grid.push(new Array(GW).fill(null))}
function carve(r,x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)grid[y][x]=r}
carve('sklad',1,1,12,22);      // 3,0 × 5,3
carve('living',14,1,27,22);    // 3,5 × 5,5
carve('hall',10,24,27,32);
carve('bath',1,24,8,32);
carve('bed',1,34,11,45);       // 2,8 × 3,2
carve('kitchen',13,36,27,45);  // 3,7 × 2,5
carve('hall',13,33,17,35);     // коридор к кухне
for(let y=27;y<=35;y++)for(let x=24;x<=28;x++)grid[y][x]=null;
carve('toilet',25,28,27,34);   // 1,0 × 2,1 (внутри стен)
carve('hall',19,23,22,23);     // двустворчатая дверь гостиной
carve('hall',9,27,9,29);       // дверь ванной
carve('hall',24,29,24,30);     // дверь туалета
carve('hall',12,34,12,35);     // дверь спальни
carve('skladdoor',10,23,12,23);
carve('entrance',28,24,28,26);

const ROOMNAME={living:'ГОСТИНАЯ',hall:'ПРИХОЖАЯ',bath:'ВАННАЯ',toilet:'ТУАЛЕТ',bed:'СПАЛЬНЯ',kitchen:'КУХНЯ',sklad:'СКЛАД'};window.__ROOMNAME=ROOMNAME;

// твёрдые предметы, в клетках [x,y,w,h]
const SOLID_CELLS=[
  [14,1,14,3],[16,4,2,2],[26,4,2,3],[14,8,3,10],[14,6,1,2],[26,10,2,6],[27,16,1,1],[26,18,2,5],[14,19,2,4], // гостиная
  [18,31,6,2],[10,31,1,1],                                     // прихожая
  [1,24,3,5],[4,24,3,2],[7,24,2,2],[7,31,2,2],                 // ванная
  [25,33,2,2],[27,32,1,3],[27,28,1,1],                         // туалет
  [1,37,7,6],[1,35,2,2],[9,41,3,5],                            // спальня
  [19,36,9,2],[26,38,2,5],[26,43,2,3],[14,41,5,4],             // кухня
];
// хлам на складе: [x,y,w,h,тип]
const JUNK=[
  [1,1,2,5,'W'],[3,1,6,2,'M'],[12,1,1,2,'B'],[7,4,2,1,'c'],[4,4,2,2,'B'],[10,4,2,2,'B'],
  [7,6,2,2,'B'],[5,7,1,2,'B'],[11,7,2,2,'X'],[1,7,2,3,'D'],[8,9,2,1,'T'],[3,10,3,2,'B'],
  [7,11,4,1,'R'],[1,13,2,2,'B'],[6,13,2,2,'B'],[10,13,2,2,'B'],[4,15,1,2,'X'],[5,16,2,1,'X'],
  [9,16,2,2,'B'],[1,17,2,2,'C'],[4,18,2,2,'B'],[8,19,3,2,'B'],[1,20,2,3,'B']
];
const solids=[];
for(const r of SOLID_CELLS)solids.push({x:r[0]*C,y:r[1]*C,w:r[2]*C,h:r[3]*C});
for(const r of JUNK)solids.push({x:r[0]*C,y:r[1]*C,w:r[2]*C,h:r[3]*C});
solids.push({x:200,y:193,w:20,h:6}); // обувница

function cellSolid(cx,cy){
  if(cx<0||cy<0||cx>=GW||cy>=GH)return true;
  const r=grid[cy][cx];
  if(r===null||r==='entrance')return true;
  if(r==='skladdoor')return S.skladLocked;
  return false;
}
function blocked(x,y,hw){
  if(scene==='yard')return yardBlocked(x,y,hw);
  const pts=[[x-hw,y-hw],[x+hw,y-hw],[x-hw,y+hw],[x+hw,y+hw]];
  for(const p of pts){if(cellSolid(Math.floor(p[0]/C),Math.floor(p[1]/C)))return true}
  for(const s of solids){if(x+hw>s.x&&x-hw<s.x+s.w&&y+hw>s.y&&y-hw<s.y+s.h)return true}
  return false;
}
function roomAt(x,y){const cx=Math.floor(x/C),cy=Math.floor(y/C);if(cx<0||cy<0||cx>=GW||cy>=GH)return null;const r=grid[cy][cx];return r==='skladdoor'||r==='entrance'?'hall':r}

// ================= STATIC MAP RENDER =================
const mapCv=mkQ(GW*C,GH*C),m=mapCv.getContext('2d');let mapDirty=true;
function R(x,y,w,h,c){m.fillStyle=c;m.fillRect(x,y,w,h)}
function box(x,y,w,h,b,hi,lo){R(x+1,y+h,w,1,'rgba(0,0,0,.22)');R(x+w,y+1,1,h-1,'rgba(0,0,0,.22)');R(x+.5,y+h,w,.5,'rgba(0,0,0,.25)');
  R(x,y,w,h,b);R(x,y,w,1,hi);R(x,y,1,h,hi);R(x,y+h-1,w,1,lo);R(x+w-1,y,1,h,lo);
  // HD: тонкая фаска и блик в полпикселя
  R(x,y,w,.5,'rgba(255,255,255,.35)');R(x+1,y+1,w-2,.5,'rgba(255,255,255,.10)');R(x+1,y+1,.5,h-2,'rgba(255,255,255,.08)');
  R(x+1,y+h-1.5,w-2,.5,'rgba(0,0,0,.12)');R(x+w-1.5,y+1,.5,h-2,'rgba(0,0,0,.10)');R(x,y+h-.5,w,.5,'rgba(0,0,0,.25)')}
function floorCell(r,x,y){
  const px=x*C,py=y*C,h=hash(x,y);
  switch(r){
    case 'living':R(px,py,C,C,'#5f4231');R(px,py+7,C,1,'#4b3324');if(h<.3)R(px+((y*3)%8),py,1,7,'#4b3324');if(h>.8)R(px+2,py+3,3,1,'#6b4c39');break;
    case 'hall':case 'skladdoor':case 'entrance':R(px,py,C,C,'#a7abb0');if(x%2===0)R(px,py,1,C,'#94989d');if(y%2===0)R(px,py,C,1,'#94989d');if(h<.35)R(px+3,py+4,2,1,'#b6babe');break;
    case 'bath':R(px,py,C,C,'#686d72');R(px,py,C,1,'#5a5f64');R(px,py,1,C,'#5a5f64');if(h<.3)R(px+4,py+3,2,2,'#73787d');break;
    case 'toilet':R(px,py,C,C,'#cdb797');R(px,py,C,1,'#b59e7e');R(px,py,1,C,'#b59e7e');if(h<.4)R(px+2+((x*5)%4),py+3,3,1,'#bea47f');break;
    case 'kitchen':{const light=(x>=19&&x<=20&&y>=39&&y<=42);R(px,py,C,C,light?'#ddcdb1':'#b8744f');R(px,py,C,1,light?'#c9b796':'#9c5d40');R(px,py,1,C,light?'#c9b796':'#9c5d40');if(h<.3&&!light)R(px+3,py+3,2,2,'#c4805c');break}
    case 'bed':R(px,py,C,C,'#b4854f');R(px,py+7,C,1,'#9b6f3f');if(h<.3)R(px+((y*5)%8),py,1,7,'#9b6f3f');break;
    case 'sklad':R(px,py,C,C,'#4c3b2c');R(px,py+7,C,1,'#3c2e22');if(h<.35)R(px+((y*3)%8),py,1,7,'#3c2e22');if(h>.6)R(px+(h*7|0),py+(h*13|0)%7,1,1,'#6c5a48');break;
  }
}
function buildMap(){
  m.clearRect(0,0,mapCv.width,mapCv.height);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const r=grid[y][x];
    if(r===null){R(x*C,y*C,C,C,'#17141d')}else floorCell(r,x,y);
  }
  // кромка стен
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    if(grid[y][x]!==null)continue;
    const px=x*C,py=y*C,n=(xx,yy)=>xx>=0&&yy>=0&&xx<GW&&yy<GH&&grid[yy][xx]!==null&&grid[yy][xx]!=='entrance';
    if(n(x,y+1))R(px,py+C-1,C,1,'#3b3548');
    if(n(x,y-1))R(px,py,C,1,'#2c2838');
    if(n(x+1,y))R(px+C-1,py,1,C,'#352f42');
    if(n(x-1,y))R(px,py,1,C,'#352f42');
  }
  hdFloors();q3Floors();
  drawLiving();drawHall();drawBath();drawToilet();drawBed();drawKitchen();drawSklad();
  hdFurniture();q3Furniture();
  mapDirty=false;
}

// ================= HD-детали карты (полпикселя) =================
function hdFloors(){
  const h2=(x,y,k)=>hash(x*7+k,y*13-k);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const r=grid[y][x],px=x*C,py=y*C;
    if(r===null){ // стены: мелкая фактура штукатурки
      for(let i=0;i<5;i++){const a=h2(x,y,i);R(px+Math.floor(a*16)/2,py+Math.floor(h2(y,x,i+9)*16)/2,.5,.5,a<.5?'#1e1a26':'#121018')}
      continue}
    const wallU=y>0&&grid[y-1][x]===null,wallL=x>0&&grid[y][x-1]===null;
    switch(r){
      case 'living':case 'bed':case 'sklad':{ // доска: волокна, сучки, блик
        const dk=r==='living'?'#55392a':r==='bed'?'#a67a46':'#433426',lt=r==='living'?'#6c4b38':r==='bed'?'#c39258':'#56442f';
        for(let i=0;i<3;i++){const gy=py+1+Math.floor(h2(x,y,i)*12)/2,gx=px+Math.floor(h2(y,x,i)*8)/2,L=1.5+Math.floor(h2(x,y,i+5)*8)/2;R(gx,gy,Math.min(L,px+C-gx),.5,i%2?lt:dk)}
        if(h2(x,y,7)<.12){R(px+3,py+3,1,.5,dk);R(px+3.5,py+3.5,.5,.5,dk)}
        R(px,py+6.5,C,.5,lt);break}
      case 'hall':case 'skladdoor':case 'entrance':{ // керамогранит: крапинка и фаска
        for(let i=0;i<4;i++){const a=h2(x,y,i);R(px+Math.floor(a*16)/2,py+Math.floor(h2(y,x,i+3)*16)/2,.5,.5,a<.5?'#9a9ea3':'#b9bdc1')}
        if(x%2===1)R(px,py,.5,C,'#b4b8bc');if(y%2===1)R(px,py,C,.5,'#b4b8bc');break}
      case 'bath':case 'toilet':case 'kitchen':{ // плитка: фаска, отблеск
        const hi=r==='bath'?'#787d82':r==='toilet'?'#dcc7a8':'#c98a64',lo=r==='bath'?'#5f6469':r==='toilet'?'#bfa889':'#a8684a';
        const light=r==='kitchen'&&x>=19&&x<=20&&y>=39&&y<=42;
        if(!light){R(px+1,py+1,C-1.5,.5,hi);R(px+1,py+1,.5,C-1.5,hi);R(px+1,py+C-.5,C-1,.5,lo);R(px+C-.5,py+1,.5,C-1,lo);
          if(h2(x,y,2)<.25)R(px+2+Math.floor(h2(x,y,3)*6)/2,py+2,1.5,.5,'rgba(255,255,255,.18)')}
        break}
    }
    // мягкая тень у стен (ambient occlusion)
    if(wallU){R(px,py,C,.5,'rgba(0,0,0,.30)');R(px,py+.5,C,.5,'rgba(0,0,0,.18)');R(px,py+1,C,.5,'rgba(0,0,0,.08)')}
    if(wallL){R(px,py,.5,C,'rgba(0,0,0,.24)');R(px+.5,py,.5,C,'rgba(0,0,0,.12)')}
  }
}
function hdFurniture(){
  // ковёр: ворс
  for(let i=0;i<260;i++){const x=144+2+Math.floor(hash(i,77)*104)/2,y=64+2+Math.floor(hash(77,i)*168)/2;R(x,y,.5,.5,hash(i,i)<.5?'rgba(255,255,255,.10)':'rgba(0,0,0,.14)')}
  // гепард: пятна и глаз
  for(let i=0;i<10;i++)R(144+17.5+i*2.6,64+52.5+(i%3)*1.5,.5,.5,'#2a1a10');R(144+44.5,64+52,.5,.5,'#ffe08a');
  // диван: швы и складки подушек
  R(118,84,18,.5,'#3a3c42');R(118,124,18,.5,'#3a3c42');for(let y=70;y<138;y+=4)R(113,y,.5,1.5,'#55575e');
  R(119.5,72.5,5,.5,'#e4e0dc');R(119.5,88.5,5,.5,'#f0eeeb');R(119.5,108.5,5,.5,'#d6d2cd');
  // клавиатуры: клавиши
  for(let k=0;k<2;k++){const kx=k?176:127;for(let i=0;i<13;i++)for(let j=0;j<2;j++)R(kx+.5+i*1,23.5+j*1,.5,.5,k?'#4a4a55':'#d8d8e0')}
  // мониторы: картинка на экранах
  R(130.5,10.5,17,.5,'#3a6aff');R(131,11,6,1,'#ff4fa3');R(140,11,5,1,'#3ef0b0');
  R(170.5,10.5,23,.5,'#ff2a2a');R(172,11,8,1,'#2a90ff');R(184,11,6,1,'#ffd23a');
  // кровать: стёжка одеяла
  for(let i=0;i<7;i++)R(27+i*5,302+(i%2)*2,.5,36,'rgba(40,60,110,.35)');
  R(14.5,310.5,8,.5,'#c8e4c6');
  // кухня: прожилки столешницы

  if(a.paused)continue;a.volume=tg>a.volume?Math.min(tg,a.volume+dt*.8):Math.max(tg,a.volume-dt*.6);if(k!==musCur&&a.volume<=0.001)a.pause()}}

  if(e.code.startsWith('Arrow'))e.preventDefault();
  if(e.code==='KeyR'&&state==='end')location.reload();
  if(e.code==='Escape'&&cut)skipCut();

const mouse={x:0,y:0,on:false};
addEventListener('mousemove',e=>{mouse.x=(e.clientX-OX)/SC;mouse.y=(e.clientY-OY)/SC;mouse.on=true});
function inSkip(x,y){return cut&&x>=SKIP.x-4&&y<=SKIP.y+SKIP.h+4}
addEventListener('mousedown',e=>{if(e.button!==0)return;const x=(e.clientX-OX)/SC,y=(e.clientY-OY)/SC;if(inSkip(x,y)){skipCut();return}action()});
const touch={on:false,mv:null,aim:null};
const BTN={x:W-30,y:H-32,r:17};

addEventListener('touchstart',e=>{e.preventDefault();touch.on=true;mouse.on=false;
  for(const t of e.changedTouches){const p=tp(t);
    if(inSkip(p.x,p.y)){skipCut();continue}
    if(state!=='play'||dlg||cut){action();continue}
    if(Math.hypot(p.x-BTN.x,p.y-BTN.y)<BTN.r+6){action();continue}
    if(p.x<W/2&&!touch.mv)touch.mv={id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y};
    else if(!touch.aim)touch.aim={id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y,t:performance.now(),moved:false};
  }},{passive:false});
addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const p=tp(t);
  if(touch.mv&&t.identifier===touch.mv.id){touch.mv.x=p.x;touch.mv.y=p.y}
  if(touch.aim&&t.identifier===touch.aim.id){touch.aim.x=p.x;touch.aim.y=p.y;if(Math.hypot(p.x-touch.aim.ox,p.y-touch.aim.oy)>6)touch.aim.moved=true}}},{passive:false});
function tend(e){for(const t of e.changedTouches){
  if(touch.mv&&t.identifier===touch.mv.id)touch.mv=null;
  if(touch.aim&&t.identifier===touch.aim.id){if(!touch.aim.moved&&performance.now()-touch.aim.t<300)action();touch.aim=null}}}
addEventListener('touchend',tend);addEventListener('touchcancel',tend);

let near=null;
function action(){
  if(state==='title'&&!menuOn){menuOn=true;music('menu');return}
  if(state==='title'){state='play';music('intro');playCut(INTRO,()=>transitionIn(startYard));return}
  if(state==='end'){location.reload();return}
  if(dlg){advance();return}
  if(cut){if(cut.t>0.6)nextShot();return}

// ================= UPDATE =================
let camX=0,camY=0,lastRoom=null,roomBanner={t:'',life:0},tm=0;
const parts=[];
function update(dt){
  tm+=dt;
  for(const t of timers)t.t-=dt;
  const due=timers.filter(t=>t.t<=0);timers=timers.filter(t=>t.t>0);due.forEach(t=>t.fn());
  if(toast){toast.life-=dt;if(toast.life<=0)toast=null}
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt);
  if(S.fade>0){S.fade+=dt*.6;if(S.fade>=1.3)state='end'}
  if(dlg){const L=dlg.lines[dlg.i];dlg.shown=Math.min(L.t.length,dlg.shown+dt*48)}
  updateMusic(dt);
  if(tr){tr.t+=dt;if(!tr.done&&tr.t>=.5){tr.done=true;tr.fn()}if(tr.t>=1)tr=null}
  if(cut){updateCut(dt);return}

  // движение
  let mx=0,my=0;
  if(state==='play'&&!dlg&&!pl.sit&&S.fade===0&&!tr&&!lockMove){
    if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
    if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
    if(touch.mv){const dx=touch.mv.x-touch.mv.ox,dy=touch.mv.y-touch.mv.oy,d=Math.hypot(dx,dy);if(d>3){const k=Math.min(1,d/20);mx=dx/d*k;my=dy/d*k}}
  }
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  pl.mv=ml>0.1;
  if(pl.mv){
    const sp=(pl.scoot?95:58)*dt;
    const nx=pl.x+mx*sp;if(!blocked(nx,pl.y,3.5))pl.x=nx;
    const ny=pl.y+my*sp;if(!blocked(pl.x,ny,3.5))pl.y=ny;
    pl.ma=Math.atan2(my,mx);pl.ph+=dt*13;
  }
  // прицел торса
  if(!pl.sit){
    let ta=null;
    if(mouse.on&&!touch.on)ta=Math.atan2(mouse.y-(pl.y-camY),mouse.x-(pl.x-camX));
    else if(touch.aim&&touch.aim.moved)ta=Math.atan2(touch.aim.y-touch.aim.oy,touch.aim.x-touch.aim.ox);
    else if(pl.mv)ta=pl.ma;
    if(pl.scoot&&pl.mv)ta=pl.ma;
    if(ta!==null){let d=ta-pl.a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;pl.a+=d*Math.min(1,dt*18)}
  }
  // кот
  if(cat.mode==='walk'){
    const tg=cat.path[0];
    if(!tg){cat.mode='idle';if(cat.then){const f=cat.then;cat.then=null;f()}}
    else{const dx=tg.x-cat.x,dy=tg.y-cat.y,d=Math.hypot(dx,dy),sp=44*dt;
      if(d<sp){cat.x=tg.x;cat.y=tg.y;cat.path.shift()}else{cat.x+=dx/d*sp;cat.y+=dy/d*sp;cat.a=Math.atan2(dy,dx)}
      cat.ph+=dt*14;}
  }
  // Шмакодявка бегает
  if(shmak.mode==='walk'){const tg=shmak.path[0];
    if(!tg){shmak.mode='stand';if(shmak.then){const f=shmak.then;shmak.then=null;f()}}
    else{const dx=tg.x-shmak.x,dy=tg.y-shmak.y,d=Math.hypot(dx,dy),sp=92*dt;
      if(d<sp){shmak.x=tg.x;shmak.y=tg.y;shmak.path.shift()}else{shmak.x+=dx/d*sp;shmak.y+=dy/d*sp;shmak.a=Math.atan2(dy,dx)}shmak.ph+=dt*16}}
  if(shmak.hug>0)shmak.hug=Math.max(0,shmak.hug-dt);
  if(cat.mode==='wait'&&cat.then&&S.bowls){const f=cat.then;cat.then=null;f()}
  // ближайший объект
  near=null;let best=1e9;
  if(state==='play'&&!dlg&&!pl.sit&&!lockMove){
    for(const it of (scene==='yard'?YIT:IT)){if(it.cond&&!it.cond())continue;const d=Math.hypot(it.x-pl.x,it.y-pl.y);if(d<(it.r||16)&&d<best){best=d;near=it}}
  }
  // комната
  if(scene==='yard'){updateYard(dt);if(lastRoom!=='yard'){lastRoom='yard';roomBanner={t:'ДВОР',life:2}}}
  const rm=scene==='yard'?null:roomAt(pl.x,pl.y);if(rm&&rm!==lastRoom){lastRoom=rm;roomBanner={t:ROOMNAME[rm],life:2}}
  if(roomBanner.life>0)roomBanner.life-=dt;
  // частицы
  if(S.step===3&&!S.litterClean&&Math.random()<dt*10)parts.push({x:rnd(202,214),y:rnd(262,272),vx:rnd(-3,3),vy:rnd(-10,-5),life:2,c:'stink'});
  if(scene==='flat'&&!S.skladLocked&&Math.random()<dt*6)parts.push({x:rnd(10,100),y:rnd(10,180),vx:rnd(-2,2),vy:rnd(-2,2),life:3,c:'dust'});
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
  // камера
  if(scene==='yard'){camX=Math.round(clamp(pl.x-W/2,0,YW-W));camY=Math.round(clamp(pl.y-H/2,0,YH-H))}
  else{camX=Math.round((GW*C-W)/2);camY=Math.round(clamp(pl.y-H/2,-8,GH*C-H+8))}
}

const shadow=mkQ(W,H),sh=shadow.getContext('2d');
function radial(g,x,y,r,c0,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c0.replace('A',a));gr.addColorStop(1,c0.replace('A',0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}

  if(open){ctx.fillStyle='#17141d';ctx.fillRect(x+w/2,y+3,w/2-1,2);ctx.fillStyle='#dfe4ea';ctx.fillRect(x+w/2,y-1,1,4)}

function spr(c,x,y,a){ctx.save();ctx.translate(Math.round(x*Q)/Q,Math.round(y*Q)/Q);ctx.rotate(a);ctx.drawImage(c,-12,-12,24,24);ctx.restore()}
function shadowBlob(x,y,r){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(Math.round(x),Math.round(y)+1,r,r*.8,0,0,7);ctx.fill()}
function render(){
  ctx.setTransform(Q,0,0,Q,0,0);
  if(state==='play'&&cut){renderCut();renderUI();return}
  if(state==='play'&&scene==='yard'){renderYard();trFade();renderUI();return}
  if(mapDirty)buildMap();
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#07050c';ctx.fillRect(0,0,W,H);

  ctx.drawImage(mapCv,0,0,GW*C,GH*C);
  // окна
  drawWindowH(120,0,32,false);drawWindowH(168,0,40,false);drawWindowH(72,0,24,false);
  drawWindowH(120,368,40,false);drawWindowH(24,368,40,S.windowOpen);
  if(S.windowOpen){const f=Math.sin(tm*3)*2;ctx.fillStyle='#24345a';ctx.fillRect(22,360+f*.5,3,8);ctx.fillRect(64,360-f*.5,3,8)}
  else{ctx.fillStyle='#24345a';ctx.fillRect(20,361,4,6);ctx.fillRect(64,361,4,6)}
  // бита на полу склада
  if(!S.bat&&!S.skladLocked){ctx.fillStyle='#a06a30';ctx.fillRect(49,98,14,2);ctx.fillStyle='#222';ctx.fillRect(49,98,4,2)}
  // кот
  if(cat.mode!=='walk'&&cat.mode!=='sleep'&&cat.mode!=='eat')cat.ph=0;
  drawCat(sprC.getContext('2d'),cat.mode==='walk'?'walk':cat.mode==='sleep'?'sleep':'idle',tm,cat.ph);
  if(cat.mode!=='sleep')shadowBlob(cat.x,cat.y,5);
  spr(sprC,cat.x,cat.y,cat.mode==='sleep'?0:cat.a+(cat.mode==='eat'?Math.sin(tm*10)*.06:0));
  // Шмакодявка сидит за компом
  drawShmak(sprS.getContext('2d'),tm);
  if(shmak.mode==='sit')spr(sprS,shmak.x,shmak.y,S.step>=7&&S.step<10?-Math.PI/2+Math.sin(tm*.7)*.6:-Math.PI/2);
  else{const mv=shmak.mode==='walk';legs(legS.getContext('2d'),shmak.ph,mv,'#f2cab2','#111116');
    const h=shmak.hug,jump=h>1.1?Math.sin((1.6-h)/.5*Math.PI)*5:0;
    shadowBlob(shmak.x,shmak.y,5);
    ctx.save();ctx.translate(Math.round(shmak.x+(h>0?Math.min(4,(1.6-h)*10):0)),Math.round(shmak.y-jump));const sc=1+jump*.04;ctx.scale(sc,sc);
    ctx.save();ctx.rotate(shmak.a);ctx.drawImage(legS,-12,-12,24,24);ctx.restore();ctx.rotate(shmak.a);ctx.drawImage(sprS,-12,-12,24,24);ctx.restore()}
  // Микроб
  if(!pl.sit){legs(legCv.getContext('2d'),pl.ph,pl.mv,'#1c1c22','#9a9ca2');shadowBlob(pl.x,pl.y,6);spr(legCv,pl.x,pl.y,pl.mv?pl.ma:pl.a)}
  drawMikrob(sprM.getContext('2d'),S.pistol?'pistol':S.bat?'bat':null);
  spr(sprM,pl.x,pl.y,pl.a);

  for(const p of parts){if(p.c==='heart'){ctx.fillStyle=`rgba(255,80,160,${Math.min(1,p.life)})`;const x=Math.round(p.x),y=Math.round(p.y);ctx.fillRect(x,y,1,1);ctx.fillRect(x+2,y,1,1);ctx.fillRect(x,y+1,3,1);ctx.fillRect(x+1,y+2,1,1);continue}

  radial(ctx,182,16,22,'rgba(170,200,255,A)',.28);radial(ctx,212,15,16,'rgba(255,40,40,A)',.4);
  radial(ctx,150,226,72,'rgba(255,255,255,A)',.08);

  if(S.alarm){const p=.5+.5*Math.sin(tm*5);radial(ctx,140,0,70,'rgba(255,20,40,A)',.25*p);radial(ctx,140,372,60,'rgba(255,20,40,A)',.25*p);radial(ctx,44,372,40,'rgba(255,20,40,A)',.25*p)}
  if(pl.sit)radial(ctx,184,26,30,'rgba(255,40,40,A)',.35+.25*Math.sin(tm*14));
  ctx.restore();
  if(S.alarm){ctx.fillStyle=`rgba(255,0,30,${.05+.04*Math.sin(tm*5)})`;ctx.fillRect(0,0,W,H)}

}

// ================= UI (высокое разрешение для текста) =================
function uiFont(sz,b){u.font=`${b?'bold ':''}${sz}px "Trebuchet MS",Verdana,sans-serif`}
function wrap(t,maxW){const words=t.split(' ');const lines=[];let cur='';for(const w of words){const tt=cur?cur+' '+w:w;if(u.measureText(tt).width>maxW&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur);return lines}
function panel(x,y,w,h,a){u.fillStyle=`rgba(8,5,16,${a||.8})`;u.fillRect(x,y,w,h)}
